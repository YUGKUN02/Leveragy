services:
  mysql:
    image: mysql:8.0
    container_name: leveragy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: leveragy
      MYSQL_USER: leveragy
      MYSQL_PASSWORD: leveragy
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  mysql_data:
